<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay organized and track your tasks</p>
        </header>

        <main>
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="Add a new task..."
                        class="task-input"
                    >
                    <button id="addBtn" class="add-btn">Add Task</button>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Tasks:</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Completed:</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Remaining:</span>
                    <span class="stat-value" id="remainingTasks">0</span>
                </div>
            </div>

            <!-- Tasks List -->
            <ul id="taskList" class="task-list">
                <li class="empty-state">
                    <p>✨ No tasks yet. Add one to get started!</p>
                </li>
            </ul>

            <!-- Clear Completed Button -->
            <div class="action-buttons">
                <button id="clearBtn" class="clear-btn" style="display: none;">
                    🗑️ Clear Completed Tasks
                </button>
            </div>
        </main>

        <footer>
            <p>Made with ❤️ | Data saved locally in your browser</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
